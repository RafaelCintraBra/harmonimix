{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block conteudo %}
<div class="card empty">
  <strong>Erro {{ codigo }}</strong>
  <p class="muted" style="margin:0 auto 14px">{{ mensagem }}</p>
  <a class="btn primary" href="{{ url_for('painel.inicio') }}">Voltar ao painel</a>
</div>
{% endblock %}
{% block pagina_publica %}
<div class="err-page"><div>
  <div class="codigo">{{ codigo }}</div>
  <h1>{{ titulo }}</h1>
  <p class="muted">{{ mensagem }}</p>
  <a class="btn primary" href="{{ url_for('auth.login') }}">Ir para o login</a>
</div></div>
{% endblock %}
